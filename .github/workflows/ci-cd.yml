name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: background_jobs
          POSTGRES_USER: job_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_user -d background_jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      POSTGRES_DB: background_jobs
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run full test suite (Unit + Integration + PostgreSQL Concurrency)
        run: pytest -v

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM
        if: env.ORACLE_SSH_KEY != ''
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          tar --exclude='.git' -czf /tmp/app.tar.gz .
          scp -i ~/.ssh/id_key -o StrictHostKeyChecking=no /tmp/app.tar.gz ${ORACLE_USER:-opc}@${ORACLE_HOST:-84.12.153.173}:~/app.tar.gz
          ssh -i ~/.ssh/id_key -o StrictHostKeyChecking=no ${ORACLE_USER:-opc}@${ORACLE_HOST:-84.12.153.173} '
            mkdir -p ~/background &&
            tar -xzf ~/app.tar.gz -C ~/background &&
            rm -f ~/app.tar.gz &&
            cd ~/background &&
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
          '
